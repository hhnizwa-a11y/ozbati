name: بناء عزبتي

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  web:
    needs: test
    runs-on: ubuntu-latest
    # يتطلب تفعيل GitHub Pages مرة واحدة: Settings ← Pages ← Source: GitHub Actions
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.OZBATI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ozbati.keystore"
            echo "OZBATI_KEYSTORE_PATH=$RUNNER_TEMP/ozbati.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::لا يوجد مفتاح توقيع في الأسرار؛ سيُبنى إصدار تجريبي (debug)."
          fi
      - name: بناء APK
        env:
          OZBATI_KEYSTORE_PASSWORD: ${{ secrets.OZBATI_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$OZBATI_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../ozbati.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ozbati.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: ozbati-apk, path: ozbati.apk }
      - name: نشر APK في صفحة الإصدارات
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: عزبتي 1.0.${{ github.run_number }}
          make_latest: true
          files: ozbati.apk
          body: |
            ملف تثبيت عزبتي لأندرويد. حمّل `ozbati.apk` من الهاتف وافتحه، ووافق على «التثبيت من مصادر غير معروفة» عند الطلب.
